services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbdoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbdoctor}
      POSTGRES_DB: ${POSTGRES_DB:-dbdoctor}
    ports:
      # Host port 5433 so it never clashes with a Postgres installed on Windows.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scenarios:/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbdoctor} -d ${POSTGRES_DB:-dbdoctor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
